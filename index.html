        .bday-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 20px; }
        .bday-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px 4px; text-align: center; }

        .bday-card .dday { font-size: 13px; color: #f472b6; font-weight: bold; display: block; }
        .bday-card.nearest .name { color: #f472b6; }
        .bday-card.nearest .dday { color: #facc15; }

        .today-banner { background: linear-gradient(135deg, #ec4899, #8b5cf6); border-radius: 12px; padding: 14px 15px; margin-bottom: 20px; font-weight: bold; font-size: 14px; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); display: none; }

        .stat-item strong { font-size: 15px; color: #facc15; }

            border-radius: 12px; 
            padding: 10px; 
            cursor: pointer; 
            border: 2px solid transparent; 
            transition: transform 0.2s, border-color 0.2s; 
            display: flex; 
            flex-direction: column; 
            align-items: center;

        .album-item:hover { transform: translateY(-4px); border-color: #6366f1; }

        input { padding: 12px 18px; width: 65%; border-radius: 20px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; font-size: 14px; }
        button { padding: 12px 18px; border-radius: 20px; border: none; background: #6366f1; color: white; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        button:hover { background: #4f46e5; }

        .random-btn:hover { background: #059669; }

        .flip-card.flipped { transform: rotateY(180deg); }
        .card-hint { font-size: 12px; color: #a5b4fc; margin-bottom: 8px; font-weight: bold; }

        // 🎂 멤버 생일 데이터
        const memberBirthdays = [
            { name: "박지원", date: "03-20" },
            { name: "백지헌", date: "04-17" },
            { name: "이채영", date: "05-14" },
            { name: "이나경", date: "06-01" },
            { name: "송하영", date: "09-29" }
        ];

        function calculateDday() {
            const debutDate = new Date("2018-01-24");
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const diffDays = Math.floor(Math.abs(today - debutDate) / (1000 * 60 * 60 * 24));
            document.getElementById("debutDday").innerText = `D+${diffDays}`;

            let calculated = memberBirthdays.map(m => {
                const [month, day] = m.date.split("-").map(Number);
                let nextBday = new Date(today.getFullYear(), month - 1, day);
                if (today > nextBday) nextBday.setFullYear(today.getFullYear() + 1);
                const dday = Math.ceil((nextBday - today) / (1000 * 60 * 60 * 24));
                return { ...m, dday: dday };
            });

            const minDday = Math.min(...calculated.map(c => c.dday));
            const grid = document.getElementById("bdayGrid");
            grid.innerHTML = "";

            calculated.forEach(m => {
                const card = document.createElement("div");
                const isNearest = m.dday === minDday;
                card.className = `bday-card ${isNearest ? 'nearest' : ''}`;
                card.innerHTML = `<span class="name">${m.name}</span><span class="dday">${m.dday === 0 ? "🎉 오늘!" : `D-${m.dday}`}</span>`;
                grid.appendChild(card);
            });
        }
        calculateDday();

        let currentFilter = "ALL";

        function checkTodayRelease() {
            const today = new Date();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const todayMD = `${month}-${day}`;

            for (let key in musicData) {
                if (musicData[key].monthDay === todayMD) {
                    const releaseYear = parseInt(musicData[key].release.substring(0, 4));
                    const yearsAgo = today.getFullYear() - releaseYear;
                    const banner = document.getElementById("todayBanner");
                    banner.innerHTML = `🎉 오늘(${month}월 ${day}일)은 <b>${musicData[key].title}</b> 발매 ${yearsAgo > 0 ? yearsAgo + '주년' : '일'}입니다! 💖`;
                    banner.style.display = "block";
                    break;
                }
            }
        }
        checkTodayRelease();

        const card = document.getElementById("flipCard");
        card.addEventListener("click", function() { card.classList.toggle("flipped"); });

        // 🖼️ 앨범 그리드 렌더링
        function renderAlbumGrid(filterType) {
            const grid = document.getElementById("albumGrid");
            grid.innerHTML = "";

            for (let key in musicData) {
                const song = musicData[key];
                
                if (filterType === "ALL" || song.type === filterType) {
                    const item = document.createElement("div");
                    item.className = "album-item";
                    item.onclick = function() { displaySongData(key); };
                    
                    item.innerHTML = `
                        <span class="badge-tag">${song.category}</span>
                        <img src="${song.img}" alt="${song.title}">
                        <p>${song.title}</p>
                    `;
                    grid.appendChild(item);
                }
            }
        }

        function filterCategory(type, btnElement) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderAlbumGrid(type);
        }

        renderAlbumGrid("ALL");

        function findSongKey(inputQuery) {
            const cleanQuery = inputQuery.replace(/\s+/g, '').toUpperCase();
            if (musicData[cleanQuery]) return cleanQuery;

            for (let key in musicData) {
                if (musicData[key].alias) {
                    for (let alias of musicData[key].alias) {
                        if (alias.replace(/\s+/g, '').toUpperCase() === cleanQuery) return key;
                    }
                }
            }
            return null;
        }

        function displaySongData(key) {
            const song = musicData[key];
            card.classList.remove("flipped");

            document.getElementById("albumImg").src = song.img;
            document.getElementById("songTitle").innerText = song.title; 
            document.getElementById("cardCategory").innerText = song.category;
            document.getElementById("releaseDate").innerText = song.release;
            document.getElementById("melonRank").innerText = song.melon || "-";
            document.getElementById("genieRank").innerText = song.genie || "-";
            document.getElementById("trophyCount").innerHTML = song.trophy || "-";
            
            const mvBtn = document.getElementById("mvLink");
            mvBtn.href = song.mv || "#";
            mvBtn.style.opacity = song.mv ? "1" : "0.5";

            const container = document.getElementById("flipCardContainer");
            container.style.display = "block";
            container.scrollIntoView({ behavior: 'smooth' });
        }

        document.getElementById("searchBtn").addEventListener("click", function() {
            const input = document.getElementById("songInput").value;
            if (!input) return alert("검색어를 입력해 주세요!");

            const matchedKey = findSongKey(input);
            if (matchedKey) displaySongData(matchedKey);
            else alert("등록되지 않은 곡입니다!\n(검색 예시: dm, 별별별, 에티튜드, 클로버, 랔큐베, 러브미백)");
        });

        document.getElementById("songInput").addEventListener("keypress", function(e) {
            if (e.key === 'Enter') document.getElementById("searchBtn").click();
        });

        document.getElementById("randomBtn").addEventListener("click", function() {
            let keys = Object.keys(musicData);
            if (currentFilter !== "ALL") {
                keys = keys.filter(k => musicData[k].type === currentFilter);
            }
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            document.getElementById("songInput").value = musicData[randomKey].title;
            displaySongData(randomKey);
        });

        document.getElementById("copyBtn").addEventListener("click", function() {
            const title = document.getElementById("songTitle").innerText;
            const release = document.getElementById("releaseDate").innerText;
            const shareText = `[fromis_9 곡 기록]\n🎵 곡명: ${title}\n📅 발매일: ${release}`;
            navigator.clipboard.writeText(shareText).then(() => alert("기록이 복사되었습니다!"));
        });
