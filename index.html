            <!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fromis_9 역대 곡 기록 & 커리어 아카이브</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #0f172a; color: white; text-align: center; padding: 40px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        .search-box { margin-bottom: 30px; display: flex; justify-content: center; gap: 10px; }
        input { padding: 12px 20px; width: 60%; border-radius: 20px; border: none; outline: none; font-size: 16px; }
        button { padding: 12px 24px; border-radius: 20px; border: none; background: #6366f1; color: white; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #4f46e5; }
        
        .card { background: #1e293b; padding: 25px; border-radius: 15px; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: left; }
        .card h2 { margin-top: 15px; text-align: center; margin-bottom: 5px; }
        .artist { color: #94a3b8; text-align: center; margin-bottom: 20px; }
        
        /* 🖼️ 이미지 & 버튼 스타일 추가 */
        .album-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 12px; display: block; margin: 0 auto; }
        .mv-btn { display: block; width: 100%; text-align: center; background: #ff0000; color: white; text-decoration: none; font-weight: bold; padding: 12px 0; border-radius: 10px; margin-top: 15px; transition: 0.2s; }
        .mv-btn:hover { background: #cc0000; }

        .rank-list { background: #334155; padding: 15px 20px; border-radius: 10px; }
        .rank-item { display: flex; justify-content: space-between; align-items: flex-start; margin: 12px 0; border-bottom: 1px solid #475569; padding-bottom: 10px; }
        .rank-item:last-child { border-bottom: none; padding-bottom: 0; }
        .rank-item span { font-weight: bold; min-width: 130px; }
        .rank-item b { text-align: right; line-height: 1.5; font-weight: normal; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 fromis_9 곡 기록 검색</h1>
        
        <div class="search-box">
            <input type="text" id="songInput" placeholder="곡 제목 (예: dm, supersonic)">
            <button id="searchBtn">검색</button>
        </div>

        <div id="resultCard" class="card">
            <!-- 🖼️ 앨범 커버 이미지 영역 -->
            <img id="albumImg" class="album-img" src="" alt="앨범 아트">
            
            <h2 id="songTitle">곡 제목</h2>
            <div id="artistName" class="artist">fromis_9 (프로미스나인)</div>
            
            <div class="rank-list">
                <h3>🏆 곡 상세 & 역대 기록</h3>
                <div class="rank-item"><span>📅 발매일</span><b id="releaseDate">-</b></div>
                <div class="rank-item"><span>🍈 멜론 최고 순위</span><b id="melonRank">-</b></div>
                <div class="rank-item"><span>🧞 지니 최고 순위</span><b id="genieRank">-</b></div>
                <div class="rank-item"><span>📺 음악방송 수상 내역</span><b id="trophyCount">-</b></div>
            </div>

            <!-- 🎬 뮤비 링크 버튼 -->
            <a id="mvLink" class="mv-btn" href="#" target="_blank">🎬 YouTube 공식 뮤직비디오 보기</a>
        </div>
    </div>

    <script>
        // 📌 이미지 주소(img) 및 뮤비 유튜브 링크(mv) 추가
        const musicData = {
            "DM": { 
                title: "DM", 
                img: "https://i.ytimg.com/vi/4gX_lOUqD3Y/maxresdefault.jpg",
                mv: "https://www.youtube.com/watch?v=4gX_lOUqD3Y",
                release: "2022년 1월 17일",
                melon: "일간 66위 / TOP 100 57위", 
                genie: "일간 24위 / 실시간 1위", 
                trophy: "총 2관왕 🏆🏆<br>• 22.01.25 더쇼 1위<br>• 22.01.26 쇼챔피언 1위" 
            },
            "STAYTHISWAY": { 
                title: "Stay This Way", 
                img: "https://i.ytimg.com/vi/0T1y-p8p26Y/maxresdefault.jpg",
                mv: "https://www.youtube.com/watch?v=0T1y-p8p26Y",
                release: "2022년 6월 27일",
                melon: "일간 82위 / TOP 100 54위", 
                genie: "일간 38위 / 실시간 1위", 
                trophy: "총 5관왕 🏆🏆🏆🏆🏆<br>• 22.07.05 더쇼 1위<br>• 22.07.06 쇼챔피언 1위<br>• 22.07.07 엠카운트다운 1위<br>• 22.07.08 뮤직뱅크 1위<br>• 22.07.09 음악중심 1위" 
            },
            "SUPERSONIC": { 
                title: "Supersonic", 
                img: "https://i.ytimg.com/vi/8aR09Oim3C4/maxresdefault.jpg",
                mv: "https://www.youtube.com/watch?v=8aR09Oim3C4",
                release: "2024년 8월 12일",
                melon: "일간 10위권 / TOP 100 상위권", 
                genie: "실시간 1위 / 상위권 유지", 
                trophy: "총 4관왕 🏆🏆🏆🏆<br>• 24.08.20 더쇼 1위<br>• 24.08.22 엠카운트다운 1위<br>• 24.08.23 뮤직뱅크 1위<br>• 24.08.24 음악중심 1위" 
            }
        };

        document.getElementById("searchBtn").addEventListener("click", function() {
            const input = document.getElementById("songInput").value;
            const query = input.replace(/\s+/g, '').toUpperCase(); 
            const card = document.getElementById("resultCard");

            if (!query) {
                alert("검색어를 입력해 주세요!");
                return;
            }

            if (musicData[query]) {
                document.getElementById("albumImg").src = musicData[query].img; // 이미지 적용
                document.getElementById("mvLink").href = musicData[query].mv;   // 뮤비 링크 적용
                document.getElementById("songTitle").innerText = musicData[query].title; 
                document.getElementById("releaseDate").innerText = musicData[query].release;
                document.getElementById("melonRank").innerText = musicData[query].melon;
                document.getElementById("genieRank").innerText = musicData[query].genie;
                document.getElementById("trophyCount").innerHTML = musicData[query].trophy;
                card.style.display = "block";
            } else {
                alert("등록되지 않은 곡입니다!\n(검색 예시: dm, stay this way, supersonic)");
                card.style.display = "none";
            }
        });
    </script>
</body>
</html>
