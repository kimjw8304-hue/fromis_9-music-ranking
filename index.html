<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fromis_9 포카 도감 & 뮤직 아카이브</title>
    <style>
        :root {
            --primary: #ff769b;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 800px; width: 100%; text-align: center; }
        .banner { background: linear-gradient(135deg, #ff769b, #ff4370); color: white; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-weight: bold; }
        
        .btn-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        button { background: var(--card-bg); color: white; border: 1px solid #334155; padding: 10px 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        button:hover, button.active { background: var(--primary); border-color: var(--primary); }
        .quiz-btn { background: #8b5cf6 !important; border-color: #8b5cf6 !important; }
        
        .search-box { margin-bottom: 20px; display: flex; gap: 8px; justify-content: center; }
        input { padding: 10px; border-radius: 8px; border: 1px solid #334155; background: var(--card-bg); color: white; width: 60%; }
        
        /* 3D 포카 카운터 */
        .card-container { perspective: 1000px; margin: 20px auto; width: 280px; height: 420px; display: none; }
        .flip-card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; cursor: pointer; }
        .flip-card.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: space-between; border: 2px solid #ffd700; background: #1e293b; }
        .card-back { transform: rotateY(180deg); background: #0f172a; border-color: var(--primary); justify-content: center; gap: 10px; }
        .card-front img { width: 100%; height: 260px; object-fit: cover; border-radius: 12px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; width: 100%; margin-top: 20px; }
        .album-item { background: var(--card-bg); padding: 8px; border-radius: 8px; cursor: pointer; text-align: center; }
        .album-item img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; }
        .album-item p { margin: 8px 0 0; font-size: 14px; font-weight: bold; }
        
        .bday-grid { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .bday-card { background: var(--card-bg); padding: 8px 12px; border-radius: 8px; font-size: 12px; }
        .bday-card.nearest { border: 1px solid var(--primary); color: var(--primary); font-weight: bold; }
        
        /* 모달 스타일 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: var(--card-bg); padding: 24px; border-radius: 16px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; text-align: center; }
        .poca-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 15px; }
        .poca-slot { background: #0f172a; padding: 8px; border-radius: 8px; font-size: 11px; }
        .poca-slot.found { border: 1px solid var(--primary); cursor: pointer; }
        .poca-slot img { width: 100%; height: 80px; object-fit: cover; border-radius: 4px; }
        
        /* 월드컵 아레나 */
        .worldcup-container { display: none; margin: 20px 0; background: var(--card-bg); padding: 20px; border-radius: 16px; }
        .wc-vs { display: flex; gap: 20px; justify-content: center; align-items: center; margin-top: 15px; }
        .wc-card { cursor: pointer; transition: transform 0.2s; }
        .wc-card:hover { transform: scale(1.05); }
        .wc-card img { width: 140px; height: 180px; object-fit: cover; border-radius: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍀 fromis_9 ARCHIVE</h1>
        <div id="debutDday" style="font-weight: bold; margin-bottom: 10px; color: var(--primary);">D+0</div>
        
        <div class="bday-grid" id="bdayGrid"></div>
        <div id="todayBanner" class="banner" style="display:none;"></div>

        <!-- 메인 메뉴 버튼들 -->
        <div class="btn-group">
            <button class="filter-btn active" onclick="filterCategory('ALL', this)">전체</button>
            <button class="filter-btn" onclick="filterCategory('TITLE', this)">타이틀곡</button>
            <button class="filter-btn" onclick="filterCategory('SPECIAL', this)">특전/스페셜</button>
            <button id="pocaBookBtn" onclick="toggleBookModal()">📚 포카 도감 (0/0)</button>
            <button onclick="startWorldCup()">⚽ 이상형 월드컵</button>
        </div>

        <!-- 🎮 신규 추가: 퀴즈 메뉴 버튼 -->
        <div class="btn-group">
            <button class="quiz-btn" onclick="startFandomExam()">🧠 덕력고사 풀어보기</button>
            <button class="quiz-btn" onclick="startLyricQuiz()">🎵 가사 퀴즈 (특전 지급)</button>
        </div>

        <!-- 검색 영역 -->
        <div class="search-box">
            <input type="text" id="songInput" placeholder="곡 제목 또는 초성 검색 (예: 랔큐베, STAY THIS WAY)">
            <button id="searchBtn">검색</button>
            <button id="randomBtn">🎲 랜덤 뽑기</button>
        </div>

        <!-- 3D 포토카드 연출 영역 -->
        <div class="card-container" id="flipCardContainer">
            <div class="flip-card" id="flipCard">
                <div class="card-front">
                    <span id="cardCategory" style="font-size: 12px; color: #94a3b8;">CATEGORY</span>
                    <img id="albumImg" src="" alt="포토카드">
                    <h3 id="songTitle" style="margin: 5px 0;">곡 제목</h3>
                    <small style="color:#aaa;">👆 클릭해서 정보 뒤집기</small>
                </div>
                <div class="card-back">
                    <h3>📊 곡 정보 & 기록</h3>
                    <p>📅 발매일: <span id="releaseDate">-</span></p>
                    <p>🍈 멜론: <span id="melonRank">-</span></p>
                    <p>🧞 지니: <span id="genieRank">-</span></p>
                    <p id="trophyCount">🏆 -</p>
                    <div style="display: flex; gap: 8px; margin-top: 10px;">
                        <a id="mvLink" href="#" target="_blank"><button>🎬 MV</button></a>
                        <a id="fanchantLink" href="#" target="_blank"><button>📣 응원법</button></a>
                        <button id="copyBtn">📋 기록 복사</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 이상형 월드컵 영역 -->
        <div class="worldcup-container" id="worldcupArena">
            <h2 id="wcRoundTitle">타이틀곡 이상형 월드컵</h2>
            <div class="wc-vs">
                <div class="wc-card" onclick="selectWCChoice(0)">
                    <img id="wcImg1" src="">
                    <p id="wcTitle1"></p>
                </div>
                <h3 style="color: var(--primary);">VS</h3>
                <div class="wc-card" onclick="selectWCChoice(1)">
                    <img id="wcImg2" src="">
                    <p id="wcTitle2"></p>
                </div>
            </div>
            <button onclick="closeWorldCup()" style="margin-top: 15px;">닫기</button>
        </div>

        <!-- 실시간 랭킹 보드 -->
        <div style="margin-top: 20px; background: var(--card-bg); padding: 15px; border-radius: 12px;">
            <h3>🏆 월드컵 우승 랭킹</h3>
            <div id="liveRankingBoard"></div>
        </div>

        <!-- 앨범 그리드 목록 -->
        <div class="grid" id="albumGrid"></div>
    </div>

    <!-- 포카 도감 모달 -->
    <div class="modal" id="bookModal">
        <div class="modal-content">
            <h2>📚 포토카드 수집 도감</h2>
            <p id="bookStatusText">수집 현황: 0 / 0개 완료</p>
            <div class="poca-grid" id="bookGrid"></div>
            <br>
            <button onclick="toggleBookModal()">닫기</button>
        </div>
    </div>

    <!-- 시크릿/특전 지급 안내 모달 -->
    <div class="modal" id="secretPocaModal">
        <div class="modal-content">
            <h2 id="secretPocaTitle">✨ 특전 포카 획득!</h2>
            <img id="secretPocaImg" src="" style="width: 150px; height: 210px; object-fit: cover; border-radius: 12px; margin: 10px 0;">
            <p>축하합니다! 새로운 포토카드가 도감에 추가되었습니다.</p>
            <button onclick="closeSecretModal()">확인</button>
        </div>
    </div>

    <script>
        // 기본 곡 데이터베이스
        const musicData = {
            "STAYTHISWAY": {
                title: "Stay This Way", category: "TITLE", type: "TITLE", grade: "GOLD",
                release: "2022년 6월 27일", monthDay: "06-27",
                img: "https://via.placeholder.com/300x420/ff769b/ffffff?text=Stay+This+Way",
                mv: "https://www.youtube.com", fanchant: "https://www.youtube.com",
                melon: "일간 42위 / TOP 100 15위", genie: "일간 20위 / 실시간 8위",
                trophy: "🏆 음악방송 5관왕 ✨", alias: ["스테이디스웨이", "스디웨", "ㅅㅌㅇㄷㅅㅇ"]
            },
            "DM": {
                title: "DM", category: "TITLE", type: "TITLE", grade: "GOLD",
                release: "2022년 1월 17일", monthDay: "01-17",
                img: "https://via.placeholder.com/300x420/8b5cf6/ffffff?text=DM",
                mv: "https://www.youtube.com", fanchant: "https://www.youtube.com",
                melon: "일간 55위 / TOP 100 21위", genie: "일간 30위",
                trophy: "🏆 음악방송 2관왕 ✨", alias: ["디엠", "ㄷㅇ"]
            },
            "LIKEYOUBETTER": {
                title: "Like You Better", category: "SPECIAL", type: "SPECIAL", grade: "SILVER",
                release: "2023년 6월 5일", monthDay: "06-05",
                img: "https://via.placeholder.com/300x420/3b82f6/ffffff?text=Like+You+Better",
                mv: "https://www.youtube.com", fanchant: "",
                melon: "일간 27위 / TOP 100 18위", genie: "일간 45위 / 실시간 30위",
                trophy: "음방 활동 수록곡 ✨", alias: ["라이크유배터", "랔큐베", "ㄹㅇㅋㅇㅂㅌ"]
            }
        };

        // 퀴즈 통과 시 해금되는 특전 포카
        const specialPocas = {
            "QUIZ_SPECIAL_1": {
                title: "✨ [특전] 덕력고사 만점 포카", category: "SPECIAL", type: "SPECIAL", grade: "GOLD",
                release: "2026-특전", monthDay: "", img: "https://via.placeholder.com/300x420/FFD700/000000?text=EXAM+MASTER",
                mv: "", fanchant: "", melon: "-", genie: "-", trophy: "🏆 덕력 인증 완료", alias: ["덕력특전"]
            },
            "QUIZ_SPECIAL_2": {
                title: "🎵 [특전] 가사 퀴즈 마스터 포카", category: "SPECIAL", type: "SPECIAL", grade: "GOLD",
                release: "2026-특전", monthDay: "", img: "https://via.placeholder.com/300x420/FFD700/000000?text=LYRIC+MASTER",
                mv: "", fanchant: "", melon: "-", genie: "-", trophy: "🏆 가사 마스터 인증", alias: ["가사특전"]
            }
        };

        // 덕력고사 문제
        const fandomExamQuestions = [
            { question: "프로미스나인(fromis_9)의 공식 데뷔일은 언제일까요?", options: ["2017년 11월 24일", "2018년 1월 24일", "2018년 6월 5일", "2019년 1월 24일"], answer: 1 },
            { question: "프로미스나인의 공식 팬덤명은 무엇일까요?", options: ["플로버 (flover)", "클로버 (clover)", "프로미 (fromie)", "포에버 (forever)"], answer: 0 }
        ];

        // 가사 퀴즈 문제
        const lyricQuizQuestions = [
            { question: "'DM' 가사 중 괄호 안에 들어갈 말은?\n\"잠깐만 나 (    ) 말할래, 좋아하는 마음 안 숨길래\"", options: ["스르륵", "아찔하게", "더는 망설이지 않고", "이대로는 안 되겠어"], answer: 1 },
            { question: "'Stay This Way' 가사 중 빈칸은?\n\"바람에 날리는 (    ) 속에서, 나와 함께 뛰어들래\"", options: ["파도", "모래", "햇살", "기억"], answer: 0 }
        ];

        const members = [
            { name: "이새롬", month: 1, day: 7 },
            { name: "송하영", month: 9, day: 29 },
            { name: "박지원", month: 3, day: 20 },
            { name: "노지선", month: 11, day: 23 },
            { name: "백지헌", month: 4, day: 17 }
        ];

        let collection = JSON.parse(localStorage.getItem('fromis9_poca_collection')) || {};
        let currentFilter = 'ALL';
        let worldCupQueue = [];
        let worldCupNextRound = [];
        let worldCupCurrentMatch = [null, null];

        window.onload = function() {
            initDebutDday();
            initBirthdayGrid();
            checkTodayRelase();
            renderAlbumGrid('ALL');
            updateBookUI();
            checkSecretPocaByTime();
            loadLiveRanking();

            document.getElementById('songInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') searchSong(); });
            document.getElementById('searchBtn').addEventListener('click', searchSong);
            document.getElementById('randomBtn').addEventListener('click', pickRandomSong);
            document.getElementById('flipCard').addEventListener('click', function() { this.classList.toggle('flipped'); });
        };

        function initDebutDday() {
            const debutDate = new Date("2018-01-24T00:00:00+09:00");
            const diffDays = Math.floor((new Date() - debutDate) / (1000 * 60 * 60 * 24)) + 1;
            document.getElementById('debutDday').innerText = `D+${diffDays}`;
        }

        function initBirthdayGrid() {
            const today = new Date();
            const currentYear = today.getFullYear();

            const bdayCalculated = members.map(m => {
                let nextBday = new Date(currentYear, m.month - 1, m.day);
                if (today > nextBday && (today.getMonth() !== nextBday.getMonth() || today.getDate() !== nextBday.getDate())) {
                    nextBday = new Date(currentYear + 1, m.month - 1, m.day);
                }
                const dday = Math.ceil((nextBday - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / (1000 * 60 * 60 * 24));
                return { ...m, dday: dday };
            });

            const minDday = Math.min(...bdayCalculated.map(m => m.dday));
            const gridEl = document.getElementById('bdayGrid');
            gridEl.innerHTML = '';

            bdayCalculated.forEach(m => {
                const cardDiv = document.createElement('div');
                cardDiv.className = `bday-card ${m.dday === minDday ? 'nearest' : ''}`;
                cardDiv.innerHTML = `<span class="name">${m.name}</span> <span class="dday">${m.dday === 0 ? "🎂 TODAY" : `D-${m.dday}`}</span>`;
                gridEl.appendChild(cardDiv);
            });
        }

        function checkTodayRelase() {
            const today = new Date();
            const todayMD = `${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            let matchedSong = Object.values(musicData).find(s => s.monthDay === todayMD);

            const banner = document.getElementById('todayBanner');
            if (matchedSong) {
                const yearsAgo = today.getFullYear() - parseInt(matchedSong.release.split('년')[0]);
                banner.innerText = `📅 ${yearsAgo > 0 ? yearsAgo + '년 전 ' : ''}오늘 은 '${matchedSong.title}' 발매일입니다! 🎉`;
                banner.style.display = 'block';
            } else { banner.style.display = 'none'; }
        }

        function filterCategory(cat, btn) {
            currentFilter = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderAlbumGrid(cat);
        }

        function renderAlbumGrid(cat) {
            const grid = document.getElementById('albumGrid');
            grid.innerHTML = '';
            for (let key in musicData) {
                const song = musicData[key];
                if (cat === 'ALL' || (cat === 'TITLE' && song.type === 'TITLE') || (cat === 'SPECIAL' && song.type === 'SPECIAL')) {
                    const item = document.createElement('div');
                    item.className = 'album-item';
                    item.onclick = () => selectSongByKey(key);
                    item.innerHTML = `<img src="${song.img}" alt="${song.title}"><p>${song.title}</p>`;
                    grid.appendChild(item);
                }
            }
        }

        function selectSongByKey(key) {
            const song = musicData[key];
            if (!song) return;

            collection[key] = true;
            localStorage.setItem('fromis9_poca_collection', JSON.stringify(collection));
            updateBookUI();

            const cardContainer = document.getElementById('flipCardContainer');
            const card = document.getElementById('flipCard');
            card.classList.remove('flipped');
            card.className = `flip-card ${song.grade || 'SILVER'}`;

            document.getElementById('cardCategory').innerText = song.category;
            document.getElementById('albumImg').src = song.img;
            document.getElementById('songTitle').innerText = song.title;
            document.getElementById('releaseDate').innerText = song.release;
            document.getElementById('melonRank').innerText = song.melon;
            document.getElementById('genieRank').innerText = song.genie;
            document.getElementById('trophyCount').innerHTML = song.trophy;

            document.getElementById('mvLink').href = song.mv || '#';
            const fanchantBtn = document.getElementById('fanchantLink');
            if (song.fanchant) { fanchantBtn.href = song.fanchant; fanchantBtn.style.display = 'block'; }
            else { fanchantBtn.style.display = 'none'; }

            document.getElementById('copyBtn').onclick = (e) => { e.stopPropagation(); copySongInfo(song); };
            cardContainer.style.display = 'block';
            cardContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function searchSong() {
            const query = document.getElementById('songInput').value.trim().toLowerCase();
            if (!query) return;
            let foundKey = Object.keys(musicData).find(k => {
                const s = musicData[k];
                return s.title.toLowerCase().includes(query) || (s.alias && s.alias.some(a => a.toLowerCase().includes(query)));
            });
            if (foundKey) selectSongByKey(foundKey);
            else alert('검색 결과가 없습니다!');
        }

        function pickRandomSong() {
            const keys = Object.keys(musicData);
            selectSongByKey(keys[Math.floor(Math.random() * keys.length)]);
        }

        function copySongInfo(song) {
            const text = `[fromis_9 곡 기록]\n🎵 곡명: ${song.title}\n📅 발매일: ${song.release}\n🍈 멜론: ${song.melon}\n🧞 지니: ${song.genie}\n🏆 수상: ${song.trophy}`;
            navigator.clipboard.writeText(text).then(() => alert('클립보드에 복사되었습니다!'));
        }

        function toggleBookModal() { document.getElementById('bookModal').classList.toggle('show'); }

        function updateBookUI() {
            const total = Object.keys(musicData).length;
            const count = Object.keys(collection).length;
            document.getElementById('pocaBookBtn').innerText = `📚 포카 도감 (${count}/${total})`;
            document.getElementById('bookStatusText').innerText = `수집 현황: ${count} / ${total}개 완료`;

            const grid = document.getElementById('bookGrid');
            grid.innerHTML = '';
            for (let key in musicData) {
                const song = musicData[key];
                const isFound = collection[key];
                const slot = document.createElement('div');
                slot.className = `poca-slot ${isFound ? 'found' : ''}`;
                if (isFound) {
                    slot.onclick = () => { toggleBookModal(); selectSongByKey(key); };
                    slot.innerHTML = `<img src="${song.img}"><span>${song.title}</span>`;
                } else {
                    slot.innerHTML = `<span>🔒<br>미수집</span>`;
                }
                grid.appendChild(slot);
            }
        }

        function checkSecretPocaByTime() {
            const hours = new Date().getHours();
            if (hours >= 21 && hours <= 23 && !collection["STAYTHISWAY"]) {
                collection["STAYTHISWAY"] = true;
                localStorage.setItem('fromis9_poca_collection', JSON.stringify(collection));
                updateBookUI();
                document.getElementById('secretPocaTitle').innerText = "✨ 밤의 선물! 시크릿 포카 등장";
                document.getElementById('secretPocaImg').src = musicData["STAYTHISWAY"].img;
                document.getElementById('secretPocaModal').classList.add('show');
            }
        }

        function closeSecretModal() { document.getElementById('secretPocaModal').classList.remove('show'); }

        /* 🧠 퀴즈 실행 로직 */
        function startFandomExam() {
            let score = 0;
            for (let i = 0; i < fandomExamQuestions.length; i++) {
                const q = fandomExamQuestions[i];
                let promptText = `[덕력고사 ${i + 1}/${fandomExamQuestions.length}]\n\n${q.question}\n\n` + q.options.map((o, idx) => `${idx + 1}. ${o}`).join('\n');
                const userInput = prompt(promptText + "\n\n정답 번호를 입력하세요 (1~4):");
                if (userInput !== null && parseInt(userInput) - 1 === q.answer) score++;
            }
            if (score === fandomExamQuestions.length) {
                alert("🎉 축하합니다! 덕력고사 만점! [특전 포토카드]가 해금되었습니다!");
                unlockSpecialPoca("QUIZ_SPECIAL_1");
            } else {
                alert(`아쉽네요! ${fandomExamQuestions.length}개 중 ${score}개 맞히셨습니다.`);
            }
        }

        function startLyricQuiz() {
            let score = 0;
            for (let i = 0; i < lyricQuizQuestions.length; i++) {
                const q = lyricQuizQuestions[i];
                let promptText = `[가사 퀴즈 ${i + 1}/${lyricQuizQuestions.length}]\n\n${q.question}\n\n` + q.options.map((o, idx) => `${idx + 1}. ${o}`).join('\n');
                const userInput = prompt(promptText + "\n\n정답 번호를 입력하세요 (1~4):");
                if (userInput !== null && parseInt(userInput) - 1 === q.answer) score++;
            }
            if (score === lyricQuizQuestions.length) {
                alert("🎵 완벽합니다! 가사 퀴즈를 모두 맞춰 [가사 마스터 특전 포카]를 획득했습니다!");
                unlockSpecialPoca("QUIZ_SPECIAL_2");
            } else {
                alert(`아쉽습니다! ${lyricQuizQuestions.length}개 중 ${score}개 맞히셨습니다.`);
            }
        }

        function unlockSpecialPoca(pocaKey) {
            if (!musicData[pocaKey]) { musicData[pocaKey] = specialPocas[pocaKey]; }
            collection[pocaKey] = true;
            localStorage.setItem('fromis9_poca_collection', JSON.stringify(collection));
            renderAlbumGrid(currentFilter);
            updateBookUI();
            
            document.getElementById('secretPocaTitle').innerText = specialPocas[pocaKey].title;
            document.getElementById('secretPocaImg').src = specialPocas[pocaKey].img;
            document.getElementById('secretPocaModal').classList.add('show');
        }

        /* ⚽ 이상형 월드컵 로직 */
        function startWorldCup() {
            const titles = Object.keys(musicData).filter(k => musicData[k].type === 'TITLE');
            worldCupQueue = titles.sort(() => 0.5 - Math.random());
            worldCupNextRound = [];
            document.getElementById('worldcupArena').style.display = 'block';
            document.getElementById('worldcupArena').scrollIntoView({ behavior: 'smooth' });
            setupWCRound();
        }

        function setupWCRound() {
            if (worldCupQueue.length === 1 && worldCupNextRound.length === 0) {
                const winnerKey = worldCupQueue[0];
                alert(`🏆 이상형 월드컵 우승 곡: [${musicData[winnerKey].title}]!`);
                saveWorldCupWin(winnerKey);
                closeWorldCup();
                selectSongByKey(winnerKey);
                return;
            }

            if (worldCupQueue.length === 0) {
                worldCupQueue = [...worldCupNextRound];
                worldCupNextRound = [];
            }

            const key1 = worldCupQueue.shift();
            const key2 = worldCupQueue.shift();

            if (!key2) { worldCupNextRound.push(key1); setupWCRound(); return; }

            worldCupCurrentMatch = [key1, key2];
            document.getElementById('wcImg1').src = musicData[key1].img;
            document.getElementById('wcTitle1').innerText = musicData[key1].title;
            document.getElementById('wcImg2').src = musicData[key2].img;
            document.getElementById('wcTitle2').innerText = musicData[key2].title;
        }

        function selectWCChoice(idx) {
            worldCupNextRound.push(worldCupCurrentMatch[idx]);
            setupWCRound();
        }

        function closeWorldCup() { document.getElementById('worldcupArena').style.display = 'none'; }

        function saveWorldCupWin(key) {
            let ranks = JSON.parse(localStorage.getItem('fromis9_wc_ranks')) || {};
            ranks[key] = (ranks[key] || 0) + 1;
            localStorage.setItem('fromis9_wc_ranks', JSON.stringify(ranks));
            loadLiveRanking();
        }

        function loadLiveRanking() {
            let ranks = JSON.parse(localStorage.getItem('fromis9_wc_ranks')) || {};
            const board = document.getElementById('liveRankingBoard');
            const sorted = Object.keys(ranks).sort((a,b) => ranks[b] - ranks[a]);

            if (sorted.length === 0) {
                board.innerHTML = `<p style="font-size:13px; color:#94a3b8;">아직 우승 기록이 없습니다.</p>`;
                return;
            }
            board.innerHTML = sorted.slice(0, 3).map((key, idx) => 
                `<div style="display:flex; justify-content:space-between; margin:5px 0;">
                    <span>${idx===0?'🥇':idx===1?'🥈':'🥉'} ${idx+1}위: ${musicData[key]?.title || key}</span>
                    <b>${ranks[key]}회 우승</b>
                </div>`
            ).join('');
        }
    </script>
</body>
</html>
