<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fromis_9 역대 곡 기록 & 커리어 아카이브</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #0f172a; color: white; text-align: center; padding: 40px 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* 📅 N년 전 오늘 배너 */
        .today-banner { background: linear-gradient(135deg, #ec4899, #8b5cf6); border-radius: 12px; padding: 12px 15px; margin-bottom: 20px; font-weight: bold; font-size: 14px; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); display: none; }

        /* 🏆 커리어 하이 모듈 */
        .career-high { background: linear-gradient(135deg, #1e1b4b, #312e81); border: 1px solid #4338ca; border-radius: 15px; padding: 18px; margin-bottom: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .career-high h3 { margin: 0 0 12px 0; font-size: 16px; color: #a5b4fc; }
        .career-stats { display: flex; justify-content: space-around; text-align: center; }
        .stat-item span { display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 4px; }
        .stat-item strong { font-size: 15px; color: #facc15; }

        /* 🗂️ 카테고리 필터 버튼 */
        .filter-group { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid #475569; background: #1e293b; color: #94a3b8; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s; }
        .filter-btn.active, .filter-btn:hover { background: #6366f1; color: white; border-color: #6366f1; }

        .search-box { margin-bottom: 15px; display: flex; justify-content: center; gap: 8px; }
        input { padding: 12px 18px; width: 60%; border-radius: 20px; border: none; outline: none; font-size: 15px; }
        button { padding: 12px 18px; border-radius: 20px; border: none; background: #6366f1; color: white; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s; }
        button:hover { background: #4f46e5; }
        
        .random-btn { background: #10b981; margin-bottom: 25px; width: 100%; border-radius: 12px; padding: 12px; font-size: 14px; }
        .random-btn:hover { background: #059669; }

        /* 🎴 3D Flip Card (포토카드 뒤집기) 스타일 */
        .flip-card-container { perspective: 1000px; margin-top: 20px; display: none; }
        .flip-card { width: 100%; height: 520px; position: relative; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
        .flip-card.flipped { transform: rotateY(180deg); }
        .card-hint { font-size: 12px; color: #a5b4fc; margin-bottom: 8px; font-weight: bold; }

        .card-front, .card-back { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 20px; padding: 25px; box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: left; }

        /* 카드 앞면 */
        .card-front { background: #1e293b; display: flex; flex-direction: column; justify-content: space-between; border: 2px solid #3b82f6; }
        .card-front .album-img { width: 100%; height: 320px; object-fit: cover; border-radius: 15px; }
        .card-front h2 { margin: 15px 0 5px 0; text-align: center; }
        .card-front .category-tag { text-align: center; font-size: 12px; background: #3b82f6; color: white; padding: 3px 10px; border-radius: 10px; width: fit-content; margin: 0 auto; }

        /* 카드 뒷면 */
        .card-back { background: #0f172a; border: 2px solid #8b5cf6; transform: rotateY(180deg); display: flex; flex-direction: column; justify-content: space-between; }
        
        .mv-btn { display: block; width: 100%; text-align: center; background: #ff0000; color: white; text-decoration: none; font-weight: bold; padding: 12px 0; border-radius: 10px; margin-top: 10px; box-sizing: border-box; }
        .copy-btn { display: block; width: 100%; text-align: center; background: #334155; color: #f1f5f9; border: 1px solid #475569; font-weight: bold; padding: 10px 0; border-radius: 10px; margin-top: 8px; cursor: pointer; }

        .rank-list { background: #1e293b; padding: 15px 20px; border-radius: 10px; }
        .rank-item { display: flex; justify-content: space-between; align-items: flex-start; margin: 10px 0; border-bottom: 1px solid #334155; padding-bottom: 8px; font-size: 14px; }
        .rank-item:last-child { border-bottom: none; padding-bottom: 0; }
        .rank-item span { font-weight: bold; min-width: 120px; }
        .rank-item b { text-align: right; line-height: 1.4; font-weight: normal; }
        .copyright { font-size: 12px; color: #64748b; margin-top: 30px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 fromis_9 곡 기록 검색</h1>
        
        <!-- 📅 N년 전 오늘 발매 배너 -->
        <div id="todayBanner" class="today-banner"></div>

        <!-- 🏆 커리어 하이 모듈 -->
        <div class="career-high">
            <h3>👑 fromis_9 CAREER HIGH</h3>
            <div class="career-stats">
                <div class="stat-item">
                    <span>최다 관왕</span>
                    <strong>Stay This Way (5관왕)</strong>
                </div>
                <div class="stat-item">
                    <span>멜론 최고 순위</span>
                    <strong>Supersonic (5위)</strong>
                </div>
                <div class="stat-item">
                    <span>총 트로피</span>
                    <strong>13개 🏆</strong>
                </div>
            </div>
        </div>

        <!-- 🗂️ 카테고리 필터링 버튼 -->
        <div class="filter-group">
            <button class="filter-btn active" onclick="filterCategory('ALL')">전체 곡</button>
            <button class="filter-btn" onclick="filterCategory('TITLE')">타이틀곡</button>
            <button class="filter-btn" onclick="filterCategory('SPECIAL')">스페셜/프로젝트</button>
        </div>

        <!-- 🔍 검색 창 -->
        <div class="search-box">
            <input type="text" id="songInput" placeholder="곡 제목 또는 초성 (예: dm, ㅅㅍㅅㄴ)">
            <button id="searchBtn">검색</button>
        </div>

        <!-- 🎲 오늘의 추천곡 버튼 -->
        <button id="randomBtn" class="random-btn">🎲 오늘 무슨 곡 들을까? (랜덤 뽑기)</button>

        <!-- 🎴 3D 포토카드 결과 영역 -->
        <div id="flipCardContainer" class="flip-card-container">
            <div class="card-hint">🔄 카드를 터치/클릭하면 뒤집어집니다!</div>
            <div id="flipCard" class="flip-card">
                
                <!-- 카드 앞면 (앨범 아트 & 카테고리) -->
                <div class="card-front">
                    <span id="cardCategory" class="category-tag">TITLE</span>
                    <img id="albumImg" class="album-img" src="" alt="앨범 아트">
                    <div>
                        <h2 id="songTitle">곡 제목</h2>
                        <div class="artist" style="color:#94a3b8; text-align:center;">fromis_9 (프로미스나인)</div>
                    </div>
                </div>

                <!-- 카드 뒷면 (성적 & 상세 정보) -->
                <div class="card-back">
                    <div class="rank-list">
                        <h3 style="margin-top:0; text-align:center; font-size:16px;">🏆 상세 성적 기록</h3>
                        <div class="rank-item"><span>📅 발매일</span><b id="releaseDate">-</b></div>
                        <div class="rank-item"><span>🍈 멜론 순위</span><b id="melonRank">-</b></div>
                        <div class="rank-item"><span>🧞 지니 순위</span><b id="genieRank">-</b></div>
                        <div class="rank-item"><span>📺 음악방송</span><b id="trophyCount">-</b></div>
                    </div>

                    <div>
                        <a id="mvLink" class="mv-btn" href="#" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">🎬 뮤직비디오 보기</a>
                        <button id="copyBtn" class="copy-btn" onclick="event.stopPropagation()">📋 기록 복사하기</button>
                    </div>
                </div>

            </div>
        </div>

        <p class="copyright">본 사이트는 비상업적 팬 아카이브 사이트입니다.</p>
    </div>

    <script>
        const musicData = {
            "LOVEBOMB": { 
                title: "LOVE BOMB", category: "TITLE", type: "TITLE", monthDay: "10-10",
                img: "https://img.youtube.com/vi/-SK6cvkK4c0/maxresdefault.jpg",
                mv: "https://www.youtube.com/watch?v=-SK6cvkK4c0",
                release: "2018년 10월 10일", melon: "일간 164위", genie: "일간 174위 / 실시간 83위", trophy: "음방 1위 후보 👏", alias: ["러브밤", "ㄹㅂㅂ"]
            },
            "FUN": { 
                title: "FUN!", category: "TITLE", type: "TITLE", monthDay: "06-04",
                img: "https://img.youtube.com/vi/zsRyyLtcXho/maxresdefault.jpg",
                mv: "https://www.youtube.com/watch?v=zsRyyLtcXho",
                release: "2019년 6월 4일", melon: "일간 167위", genie: "일간 109위 / 실시간 30위", trophy: "음방 활동 곡 👏", alias: ["펀", "ㅍ"]
            },
            "WEGO": { 
                title: "WE GO", category: "TITLE", type: "TITLE", monthDay: "05-17",
                img: "https://img.youtube.com/vi/HM6UpQZvbhY/maxresdefault.jpg",
                mv: "https://www.youtube.com/watch?v=HM6UpQZvbhY",
                release: "2021년 5월 17일", melon: "일간 108위", genie: "일간 14위 / 실시간 4위", trophy: "음방 1위 후보 👏", alias: ["위고", "ㅇㄱ"]
            },
            "TALK&TALK": { 
                title: "Talk & Talk", category: "SPECIAL", type: "SPECIAL", monthDay: "09-01",
                img: "https://img.youtube.com/vi/BjmmvBMXbSU/maxresdefault.jpg",
                mv: "https://www.youtube.com/watch?v=BjmmvBMXbSU",
                release: "2021년 9월 1일", melon: "일간 204위", genie: "일간 212위", trophy: "총 1관왕 🏆<br>• 21.09.07 더쇼 1위", alias: ["톡앤톡", "ㅌㅇㅌ"]
            },
            "DM": { 
                title: "DM", category: "TITLE", type: "TITLE", monthDay: "01-17",
                img: "https://img.youtube.com/vi/4gXmClk8rKI/maxresdefault.jpg",
                mv: "https://www.youtube.com/watch?v=4gXmClk8rKI",
                release: "2022년 1월 17일", melon: "일간 66위 / TOP 100 52위", genie: "일간 137위", trophy: "총 2관왕 🏆🏆<br>• 더쇼, 쇼챔 1위", alias: ["디엠", "ㄷㅁ"]
            },
            "STAYTHISWAY": { 
                title: "Stay This Way", category: "TITLE", type: "TITLE", monthDay: "06-27",
                img: "https://img.youtube.com/vi/JC6budcACNE/maxresdefault.jpg",
                mv: "https://www.youtube.com/watch?v=JC6budcACNE",
                release: "2022년 6월 27일", melon: "일간 100위 / TOP 100 86위", genie: "일간 142위", trophy: "총 5관왕 🏆🏆🏆🏆🏆<br>• 더쇼, 쇼챔, 엠카, 뮤뱅, 음중", alias: ["스디웨", "ㅅㄷㅇ"]
            },
            "MENOW": { 
                title: "#menow", category: "TITLE", type: "TITLE", monthDay: "06-05",
                img: "https://img.youtube.com/vi/QrYIOjs7K8E/maxresdefault.jpg",
                mv: "https://www.youtube.com/watch?v=QrYIOjs7K8E",
                release: "2023년 6월 5일", melon: "일간 204위", genie: "일간 249위", trophy: "총 1관왕 🏆<br>• 23.06.13 더쇼 1위", alias: ["미나우", "ㅁㄴㅇ"]
            },
            "SUPERSONIC": { 
                title: "Supersonic", category: "TITLE", type: "TITLE", monthDay: "08-12",
                img: "https://img.youtube.com/vi/0LiQp7y8Wwc/maxresdefault.jpg",
                mv: "https://www.youtube.com/watch?v=0LiQp7y8Wwc",
                release: "2024년 8월 12일", melon: "일간 7위 / TOP 100 5위", genie: "일간 28위", trophy: "총 4관왕 🏆🏆🏆🏆<br>• 더쇼, 엠카, 뮤뱅, 음중", alias: ["슈퍼소닉", "ㅅㅍㅅㄴ"]
            }
        };

        let currentFilter = "ALL";

        // 📅 1. N년 전 오늘 배너 감지 로직
        function checkTodayRelease() {
            const today = new Date();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const todayMD = `${month}-${day}`;

            for (let key in musicData) {
                if (musicData[key].monthDay === todayMD) {
                    const releaseYear = parseInt(musicData[key].release.substring(0, 4));
                    const yearsAgo = today.getFullYear() - releaseYear;
                    const banner = document.getElementById("todayBanner");
                    
                    banner.innerHTML = `🎉 오늘(${month}월 ${day}일)은 <b>${musicData[key].title}</b> 발매 ${yearsAgo > 0 ? yearsAgo + '주년' : '일'}입니다! 💖`;
                    banner.style.display = "block";
                    break;
                }
            }
        }
        checkTodayRelease();

        // 🎴 2. 포토카드 뒤집기 클릭 토글
        const card = document.getElementById("flipCard");
        card.addEventListener("click", function() {
            card.classList.toggle("flipped");
        });

        // 🔍 검색 로직
        function findSongKey(inputQuery) {
            const cleanQuery = inputQuery.replace(/\s+/g, '').toUpperCase();
            if (musicData[cleanQuery]) return cleanQuery;

            for (let key in musicData) {
                if (musicData[key].alias) {
                    for (let alias of musicData[key].alias) {
                        if (alias.replace(/\s+/g, '').toUpperCase() === cleanQuery) return key;
                    }
                }
            }
            return null;
        }

        // 🗂️ 3. 카테고리 필터링 로직
        function filterCategory(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function displaySongData(key) {
            const song = musicData[key];
            
            // 필터링 적용 확인
            if (currentFilter !== "ALL" && song.type !== currentFilter) {
                alert(`현재 '${currentFilter === "TITLE" ? "타이틀곡" : "스페셜"}' 필터가 적용 중입니다. 전체 곡 보기로 변경해보세요!`);
                return;
            }

            card.classList.remove("flipped"); // 새 검색 시 앞면으로 원복

            document.getElementById("albumImg").src = song.img;
            document.getElementById("mvLink").href = song.mv;
            document.getElementById("songTitle").innerText = song.title; 
            document.getElementById("cardCategory").innerText = song.category;
            document.getElementById("releaseDate").innerText = song.release;
            document.getElementById("melonRank").innerText = song.melon;
            document.getElementById("genieRank").innerText = song.genie;
            document.getElementById("trophyCount").innerHTML = song.trophy;
            
            const container = document.getElementById("flipCardContainer");
            container.style.display = "block";
            container.scrollIntoView({ behavior: 'smooth' });
        }

        // 검색 실행
        document.getElementById("searchBtn").addEventListener("click", function() {
            const input = document.getElementById("songInput").value;
            if (!input) return alert("검색어를 입력해 주세요!");

            const matchedKey = findSongKey(input);
            if (matchedKey) displaySongData(matchedKey);
            else alert("등록되지 않은 곡입니다!");
        });

        document.getElementById("songInput").addEventListener("keypress", function(e) {
            if (e.key === 'Enter') document.getElementById("searchBtn").click();
        });

        // 🎲 랜덤 버튼
        document.getElementById("randomBtn").addEventListener("click", function() {
            let keys = Object.keys(musicData);
            if (currentFilter !== "ALL") {
                keys = keys.filter(k => musicData[k].type === currentFilter);
            }
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            document.getElementById("songInput").value = musicData[randomKey].title;
            displaySongData(randomKey);
        });

        // 📋 성적 복사
        document.getElementById("copyBtn").addEventListener("click", function() {
            const title = document.getElementById("songTitle").innerText;
            const release = document.getElementById("releaseDate").innerText;
            const melon = document.getElementById("melonRank").innerText;
            const trophyText = document.getElementById("trophyCount").innerText.replace(/\n/g, ' ');

            const shareText = `[fromis_9 곡 기록]\n🎵 곡명: ${title}\n📅 발매일: ${release}\n🍈 멜론: ${melon}\n🏆 성적: ${trophyText}`;

            navigator.clipboard.writeText(shareText).then(() => {
                alert("성적 기록이 복사되었습니다!");
            });
        });
    </script>
</body>
</html>
