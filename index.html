<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fromis_9 아카이브 & 포카 도감</title>
    <style>
        /* 기본 스타일 세팅 */
        body { font-family: 'Pretendard', sans-serif; background-color: #fcf8f9; margin: 0; padding: 20px; color: #333; }
        h1, h2, h3 { color: #ff6b81; text-align: center; }
        button { background-color: #ff6b81; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; }
        button:hover { background-color: #ff4757; }
        
        /* 컨트롤 패널 (검색, 랜덤, 도감 버튼) */
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .search-input { padding: 10px; border-radius: 8px; border: 1px solid #ccc; width: 200px; }
        
        /* 앨범 그리드 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 10px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; border-radius: 8px; aspect-ratio: 1/1; object-fit: cover; }
        .card h4 { margin: 10px 0 5px 0; font-size: 14px; }
        
        /* 3D 포토카드 (뒤집기 효과) */
        .flip-card-container { display: none; text-align: center; margin: 30px auto; perspective: 1000px; }
        .flip-card { width: 250px; height: 350px; margin: 0 auto; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .flip-card.flipped { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .flip-card-front { background: white; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; }
        .flip-card-front img { width: 100%; border-radius: 10px; }
        .flip-card-back { background: #ff6b81; color: white; transform: rotateY(180deg); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; }
        .flip-card-back p { margin: 8px 0; font-size: 14px; }
        
        /* 모달 (도감 및 시크릿 카드) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 80%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .book-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 15px; max-height: 300px; overflow-y: auto; }
        .book-item { background: #eee; padding: 5px 10px; border-radius: 20px; font-size: 12px; color: #888; }
        .book-item.collected { background: #ff6b81; color: white; font-weight: bold; }
        
        /* 시크릿 카드 강조 */
        .secret-img { width: 150px; border-radius: 10px; margin: 15px 0; box-shadow: 0 5px 15px rgba(255,107,129,0.5); }
    </style>
</head>
<body>

    <h1>🍀 fromis_9 포카 도감 🍀</h1>
    
    <div class="controls">
        <input type="text" id="searchInput" class="search-input" placeholder="곡 제목을 검색해보세요 (초성 가능)" onkeyup="if(event.key==='Enter') searchSong()">
        <button onclick="searchSong()">🔍 검색</button>
        <button onclick="randomGacha()">🎲 랜덤 뽑기</button>
        <button onclick="openBookModal()" style="background-color: #2ed573;">📚 내 도감 보기 (<span id="bookCount">0</span>/14)</button>
    </div>

    <!-- 3D 포토카드 영역 (곡 선택 시 나타남) -->
    <div id="flipCardContainer" class="flip-card-container">
        <h3 id="cardCategory">카테고리</h3>
        <div class="flip-card" id="flipCard" onclick="this.classList.toggle('flipped')">
            <div class="flip-card-front">
                <img id="albumImg" src="" alt="앨범 이미지">
                <h2 id="songTitle" style="color: #333; margin-top: 15px;">곡 제목</h2>
                <p style="color: #777; font-size: 12px;">(카드를 클릭해 뒷면을 확인하세요)</p>
            </div>
            <div class="flip-card-back">
                <h2>🎵 기록 카드</h2>
                <p><strong>발매일:</strong> <span id="releaseDate"></span></p>
                <p><strong>멜론 최고 순위:</strong> <span id="melonRank"></span></p>
                <p><strong>지니 최고 순위:</strong> <span id="genieRank"></span></p>
                <p><strong>음방 트로피:</strong> <span id="trophyCount"></span></p>
                <div style="margin-top: 15px;">
                    <a id="mvLink" href="#" target="_blank"><button style="background: white; color: #ff6b81; font-size: 12px;">MV 보기</button></a>
                    <button id="copyBtn" style="background: #333; font-size: 12px;">기록 복사</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 곡 목록 그리드 -->
    <div class="grid" id="songGrid">
        <!-- 자바스크립트로 곡 리스트가 생성됩니다 -->
    </div>

    <!-- 📚 도감 모달창 -->
    <div id="bookModal" class="modal-overlay" onclick="closeModals(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>나의 포토카드 도감 🗂️</h2>
            <p>현재 <strong style="color:#ff6b81;"><span id="modalBookCount">0</span> / 14</strong> 개 수집 완료!</p>
            <div class="book-list" id="bookList"></div>
            <button onclick="closeModals()" style="margin-top: 20px; width: 100%;">닫기</button>
        </div>
    </div>

    <!-- ✨ 깜짝 시크릿 카드 획득 모달창 -->
    <div id="secretModal" class="modal-overlay" onclick="closeModals(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>🎉 깜짝 시크릿 카드 드롭! 🎉</h2>
            <p>플로버를 위한 선물이 도착했어요!</p>
            <img id="secretPocaImg" src="" class="secret-img" alt="시크릿 카드">
            <h3 id="secretPocaTitle" style="margin-top: 5px;">곡 제목</h3>
            <p style="font-size: 14px; color: #666;">도감에 안전하게 보관되었습니다.</p>
            <button onclick="closeModals()" style="margin-top: 20px; width: 100%;">확인</button>
        </div>
    </div>

    <script>
        // 1. 프로미스나인 곡 데이터 (총 14곡 세팅)
        const musicData = {
            'glass_shoes': { title: '유리구두', category: '프리데뷔', release: '2017-11-30', melon: '-', genie: '-', trophy: '0', img: 'https://via.placeholder.com/200/FFB6C1/FFFFFF?text=Glass+Shoes' },
            'to_heart': { title: 'To Heart', category: '타이틀', release: '2018-01-24', melon: '100위권 밖', genie: '100위권 밖', trophy: '0', img: 'https://via.placeholder.com/200/87CEFA/FFFFFF?text=To+Heart' },
            'dkdk': { title: '두근두근(DKDK)', category: '타이틀', release: '2018-06-05', melon: '100위권 밖', genie: '100위권 밖', trophy: '0', img: 'https://via.placeholder.com/200/98FB98/FFFFFF?text=DKDK' },
            'love_bomb': { title: 'LOVE BOMB', category: '타이틀', release: '2018-10-10', melon: '81위', genie: '상위권', trophy: '0', img: 'https://via.placeholder.com/200/FFA07A/FFFFFF?text=LOVE+BOMB' },
            'fun': { title: 'FUN!', category: '타이틀', release: '2019-06-04', melon: '100위권 밖', genie: '상위권', trophy: '0', img: 'https://via.placeholder.com/200/FFFFE0/000000?text=FUN!' },
            'feel_good': { title: 'Feel Good (SECRET CODE)', category: '타이틀', release: '2020-09-16', melon: '차트인', genie: '차트인', trophy: '0', img: 'https://via.placeholder.com/200/DDA0DD/FFFFFF?text=Feel+Good' },
            'we_go': { title: 'WE GO', category: '타이틀', release: '2021-05-17', melon: '탑 100', genie: '탑 100', trophy: '0', img: 'https://via.placeholder.com/200/20B2AA/FFFFFF?text=WE+GO' },
            'talk_talk': { title: 'Talk & Talk', category: '타이틀', release: '2021-09-01', melon: '차트인', genie: '차트인', trophy: '1관왕 🏆', img: 'https://via.placeholder.com/200/FF69B4/FFFFFF?text=Talk+%26+Talk' },
            'dm': { title: 'DM', category: '타이틀', release: '2022-01-17', melon: '탑 100', genie: '탑 10', trophy: '2관왕 🏆🏆', img: 'https://via.placeholder.com/200/E6E6FA/000000?text=DM' },
            'stay_this_way': { title: 'Stay This Way', category: '타이틀', release: '2022-06-27', melon: '14위', genie: '1위', trophy: '5관왕 🏆x5', img: 'https://via.placeholder.com/200/00FFFF/000000?text=Stay+This+Way' },
            'menow': { title: '#menow', category: '타이틀', release: '2023-06-05', melon: '차트인', genie: '차트인', trophy: '1관왕 🏆', img: 'https://via.placeholder.com/200/C0C0C0/000000?text=%23menow' },
            'supersonic': { title: 'Supersonic', category: '타이틀', release: '2024-08-12', melon: '1위', genie: '1위', trophy: '4관왕 🏆x4', img: 'https://via.placeholder.com/200/FF4500/FFFFFF?text=Supersonic' },
            'prom_night': { title: 'Prom Night', category: '수록곡', release: '2023-06-05', melon: '-', genie: '-', trophy: '0', img: 'https://via.placeholder.com/200/000080/FFFFFF?text=Prom+Night' },
            'rewind': { title: 'Rewind', category: '수록곡', release: '2022-06-27', melon: '-', genie: '-', trophy: '0', img: 'https://via.placeholder.com/200/DAA520/FFFFFF?text=Rewind' }
        };

        // 2. 도감(수집) 로직 세팅
        let collectedPocas = [];
        const allPocaKeys = Object.keys(musicData);

        // 첫 화면 그리드 렌더링
        const grid = document.getElementById('songGrid');
        for (const [key, song] of Object.entries(musicData)) {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<img src="${song.img}" alt="${song.title}"><h4>${song.title}</h4>`;
            div.onclick = () => selectSong(key);
            grid.appendChild(div);
        }

        // 3. 곡 선택 & 3D 포토카드 보기 + "도감 하나씩 열기"
        function selectSong(key) {
            const song = musicData[key];
            if (!song) return;

            // 카드 정보 업데이트
            document.getElementById("cardCategory").innerText = song.category;
            document.getElementById("albumImg").src = song.img;
            document.getElementById("songTitle").innerText = song.title;
            document.getElementById("releaseDate").innerText = song.release;
            document.getElementById("melonRank").innerText = song.melon;
            document.getElementById("genieRank").innerText = song.genie;
            document.getElementById("trophyCount").innerText = song.trophy;
            
            // 카드 보이기 및 뒤집기 초기화
            const flipCard = document.getElementById("flipCard");
            flipCard.classList.remove("flipped");
            document.getElementById("flipCardContainer").style.display = "block";
            document.getElementById("flipCardContainer").scrollIntoView({ behavior: 'smooth' });

            // ⭐ 기능 1: 도감에 없는 곡을 뽑았을 때 도감 하나씩 추가 & 알림!
            if (!collectedPocas.includes(key)) {
                collectedPocas.push(key);
                updateBookData();
                
                // 자연스러운 알림을 위해 0.3초 뒤에 띄움
                setTimeout(() => {
                    alert(`🎉 앗! 새로운 포토카드 [ ${song.title} ] 획득!\n도감에 한 칸이 채워졌습니다!`);
                }, 300);
            }

            // 복사 기능
            document.getElementById("copyBtn").onclick = (e) => {
                e.stopPropagation(); // 카드 뒤집힘 방지
                const text = `[fromis_9] ${song.title}\n발매일: ${song.release}\n최고 기록 - 멜론: ${song.melon}, 트로피: ${song.trophy}`;
                navigator.clipboard.writeText(text).then(() => alert("기록이 클립보드에 복사되었습니다!"));
            };
        }

        // 검색 기능
        function searchSong() {
            const query = document.getElementById('searchInput').value.replace(/\s+/g, '').toLowerCase();
            if(!query) return alert("검색어를 입력해주세요!");
            
            for (const [key, song] of Object.entries(musicData)) {
                const titleStr = song.title.replace(/\s+/g, '').toLowerCase();
                // 단순 검색 로직 (초성 검색은 라이브러리가 필요해 텍스트 포함 여부로 간단히 대체)
                if (titleStr.includes(query)) {
                    selectSong(key);
                    return;
                }
            }
            alert("해당하는 곡을 찾을 수 없습니다.");
        }

        // 랜덤 뽑기
        function randomGacha() {
            const randomIndex = Math.floor(Math.random() * allPocaKeys.length);
            selectSong(allPocaKeys[randomIndex]);
        }

        // 도감 UI 업데이트
        function updateBookData() {
            document.getElementById('bookCount').innerText = collectedPocas.length;
            document.getElementById('modalBookCount').innerText = collectedPocas.length;
            
            const bookList = document.getElementById('bookList');
            bookList.innerHTML = '';
            
            allPocaKeys.forEach(key => {
                const song = musicData[key];
                const span = document.createElement('span');
                if (collectedPocas.includes(key)) {
                    span.className = 'book-item collected';
                    span.innerText = song.title; // 수집완료
                } else {
                    span.className = 'book-item';
                    span.innerText = '??? (미수집)'; // 미수집
                }
                bookList.appendChild(span);
            });
        }

        // 모달창 열고 닫기 로직
        function openBookModal() {
            updateBookData();
            document.getElementById('bookModal').style.display = 'flex';
        }
        function closeModals(e) {
            // 배경을 클릭하거나 닫기 버튼을 눌렀을 때만 모달 닫기
            if (!e || e.target.classList.contains('modal-overlay')) {
                document.getElementById('bookModal').style.display = 'none';
                document.getElementById('secretModal').style.display = 'none';
            }
        }

        // ⭐ 기능 2: 시간 지나서 얻는 시크릿 카드 도감 자동 오픈!
        function dropTimeSecretPoca() {
            // 아직 수집하지 않은 곡들만 찾아내기
            const uncollected = allPocaKeys.filter(k => !collectedPocas.includes(k));
            
            // 다 모았다면 종료
            if (uncollected.length === 0) return; 

            // 미수집 곡 중 랜덤 1개 선택
            const randomKey = uncollected[Math.floor(Math.random() * uncollected.length)];
            const song = musicData[randomKey];

            // 모달 정보 채우고 띄우기
            document.getElementById("secretPocaTitle").innerText = song.title;
            document.getElementById("secretPocaImg").src = song.img;
            document.getElementById('secretModal').style.display = 'flex';

            // 도감에 추가
            collectedPocas.push(randomKey);
            updateBookData();
        }

        // 페이지 접속 후 15초(15000ms) 뒤에 시크릿 카드 드롭 실행!
        // (원하시면 15000을 30000(30초) 등으로 바꿔보세요)
        setTimeout(dropTimeSecretPoca, 15000);

        // 초기 도감 UI 세팅
        updateBookData();

    </script>
</body>
</html>
