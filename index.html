<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fromis_9 역대 곡 기록 & 커리어 아카이브</title>
    <style>
        :root {
            --primary-color: #f7cac9; /* 프로미스나인 상징색과 어울리는 톤 */
            --text-color: #333;
            --bg-color: #f9f9f9;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #ff6b6b;
            margin-bottom: 30px;
        }

        /* 앨범 컨테이너 스타일 */
        .album-container {
            background: white;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        /* 앨범 제목 (클릭 영역) */
        .album-header {
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            transition: background-color 0.2s;
            font-weight: bold;
            font-size: 1.1em;
        }

        .album-header:hover {
            background-color: #fff0f0;
        }

        .album-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .release-date {
            font-size: 0.8em;
            color: #888;
            font-weight: normal;
        }

        /* 화살표 애니메이션 */
        .arrow {
            transition: transform 0.3s ease;
        }
        .album-container.active .arrow {
            transform: rotate(180deg);
        }

        /* 솨라락 애니메이션 핵심 (CSS Grid 활용) */
        .album-content-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-out;
        }

        .album-container.active .album-content-wrapper {
            grid-template-rows: 1fr;
        }

        .album-content {
            overflow: hidden;
        }

        /* 수록곡 리스트 스타일 */
        .track-list {
            list-style: none;
            padding: 0;
            margin: 0;
            border-top: 1px solid #eee;
        }

        .track-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f1f1f1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .track-item:last-child {
            border-bottom: none;
        }

        .track-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-badge {
            background-color: #ff6b6b;
            color: white;
            font-size: 0.7em;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .track-stats {
            font-size: 0.85em;
            color: #666;
            text-align: right;
        }
    </style>
</head>
<body>

    <h1>🍀 fromis_9 커리어 아카이브</h1>
    <div id="archive-container"></div>

    <script>
        // 앨범 단위로 데이터 구조 개편 (수록곡 포함)
        const musicData = [
            {
                albumName: "Supersonic (3rd Single Album)",
                releaseDate: "2024.08.12",
                tracks: [
                    { title: "Supersonic", isTitle: true, melonRank: "Top 100", trophies: 4, mvLink: "...", cheerLink: "...", alias: ["슈퍼소닉", "슈소"] },
                    { title: "Beat the Heat", isTitle: false, melonRank: "-", trophies: 0, mvLink: "", cheerLink: "", alias: ["비더힛"] },
                    { title: "Take A Chance", isTitle: false, melonRank: "-", trophies: 0, mvLink: "", cheerLink: "", alias: ["테이크어찬스"] }
                ]
            },
            {
                albumName: "Unlock My World (1st Studio Album)",
                releaseDate: "2023.06.05",
                tracks: [
                    { title: "Attitude", isTitle: false, melonRank: "-", trophies: 0, mvLink: "", cheerLink: "", alias: ["애티튜드"] },
                    { title: "#menow", isTitle: true, melonRank: "Top 100", trophies: 1, mvLink: "...", cheerLink: "...", alias: ["미나우", "샵미나우"] },
                    { title: "Wishlist", isTitle: false, melonRank: "-", trophies: 0, mvLink: "", cheerLink: "", alias: ["위시리스트"] },
                    { title: "In the Mirror", isTitle: false, melonRank: "-", trophies: 0, mvLink: "", cheerLink: "", alias: ["인더미러"] },
                    { title: "Don't Care", isTitle: false, melonRank: "-", trophies: 0, mvLink: "", cheerLink: "", alias: ["돈케어"] },
                    { title: "Prom Night", isTitle: false, melonRank: "-", trophies: 0, mvLink: "", cheerLink: "", alias: ["프롬나이트"] },
                    { title: "Bring It On", isTitle: false, melonRank: "-", trophies: 0, mvLink: "", cheerLink: "", alias: ["브링잇온"] },
                    { title: "What I Want", isTitle: false, melonRank: "-", trophies: 0, mvLink: "", cheerLink: "", alias: ["왓아이원트"] },
                    { title: "My Night Routine", isTitle: false, melonRank: "-", trophies: 0, mvLink: "", cheerLink: "", alias: ["마이나이트루틴"] },
                    { title: "눈맞춤", isTitle: false, melonRank: "-", trophies: 0, mvLink: "", cheerLink: "", alias: ["아이컨택"] }
                ]
            },
            {
                albumName: "from our Memento Box (5th Mini Album)",
                releaseDate: "2022.06.27",
                tracks: [
                    { title: "Up And", isTitle: false, melonRank: "-", trophies: 0, mvLink: "", cheerLink: "", alias: ["업앤"] },
                    { title: "Stay This Way", isTitle: true, melonRank: "Top 100", trophies: 5, mvLink: "...", cheerLink: "...", alias: ["스테이디스웨이", "스디웨"] },
                    { title: "Blind Letter", isTitle: false, melonRank: "-", trophies: 0, mvLink: "", cheerLink: "", alias: ["블라인드레터"] },
                    { title: "Cheese", isTitle: false, melonRank: "-", trophies: 0, mvLink: "", cheerLink: "", alias: ["치즈"] },
                    { title: "Rewind", isTitle: false, melonRank: "-", trophies: 0, mvLink: "", cheerLink: "", alias: ["리와인드"] }
                ]
            }
            // 이후 앨범(Midnight Guest, 9 WAY TICKET 등)도 이 구조로 추가하면 됩니다!
        ];

        function renderAlbums() {
            const container = document.getElementById('archive-container');
            
            musicData.forEach((album, index) => {
                // 1. 앨범 컨테이너 생성
                const albumDiv = document.createElement('div');
                albumDiv.className = 'album-container';

                // 2. 앨범 헤더 (클릭되는 부분)
                const headerDiv = document.createElement('div');
                headerDiv.className = 'album-header';
                headerDiv.innerHTML = `
                    <div class="album-info">
                        <span>${album.albumName}</span>
                        <span class="release-date">${album.releaseDate}</span>
                    </div>
                    <div class="arrow">▼</div>
                `;

                // 3. 수록곡 리스트 래퍼 (솨라락 애니메이션용)
                const contentWrapper = document.createElement('div');
                contentWrapper.className = 'album-content-wrapper';

                const contentDiv = document.createElement('div');
                contentDiv.className = 'album-content';

                const trackList = document.createElement('ul');
                trackList.className = 'track-list';

                // 4. 수록곡 데이터 삽입
                album.tracks.forEach(track => {
                    const li = document.createElement('li');
                    li.className = 'track-item';
                    
                    const titleHtml = track.isTitle 
                        ? `<div class="track-title"><span class="title-badge">TITLE</span> ${track.title}</div>`
                        : `<div class="track-title">${track.title}</div>`;

                    const statsHtml = track.isTitle
                        ? `<div class="track-stats">🏆 ${track.trophies}관왕</div>`
                        : `<div class="track-stats">-</div>`;

                    li.innerHTML = titleHtml + statsHtml;
                    trackList.appendChild(li);
                });

                contentDiv.appendChild(trackList);
                contentWrapper.appendChild(contentDiv);
                
                albumDiv.appendChild(headerDiv);
                albumDiv.appendChild(contentWrapper);

                // 5. 클릭 이벤트 추가 (아코디언 토글)
                headerDiv.addEventListener('click', () => {
                    // 열려있는 다른 앨범을 닫고 싶다면 아래 코드를 활성화하세요
                    // document.querySelectorAll('.album-container').forEach(el => {
                    //     if(el !== albumDiv) el.classList.remove('active');
                    // });
                    
                    albumDiv.classList.toggle('active');
                });

                container.appendChild(albumDiv);
            });
        }

        // 페이지 로드 시 렌더링 실행
        window.onload = renderAlbums;
    </script>
</body>
</html>
